name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: sdk/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: sdk
        run: pnpm install --frozen-lockfile

      - name: Security audit
        working-directory: sdk
        run: pnpm audit

      - name: Lint
        working-directory: sdk
        run: pnpm run lint

      - name: Format check
        working-directory: sdk
        run: pnpm run format:check

      - name: Build SDK
        working-directory: sdk
        run: pnpm run build

      - name: Verify bundle
        working-directory: sdk
        run: |
          # Ensure single bundled output exists
          test -f dist/index.js || (echo "dist/index.js not found" && exit 1)

          # Ensure no __VERSION__ placeholder remains
          if grep -q '__VERSION__' dist/index.js; then
            echo "__VERSION__ placeholder was not replaced"
            exit 1
          fi

          # Ensure Node.js can import it
          node -e "import('./dist/index.js').then(m => { const keys = Object.keys(m); console.log('Exports:', keys); if (!keys.includes('Hippocampus')) { process.exit(1); } })"

          echo "SDK bundle verified"
